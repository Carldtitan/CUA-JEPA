[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-jepa"
version = "0.1.0"
description = "Action-conditioned GUI transition data for a controlled JEPA computer-use experiment"
requires-python = ">=3.11"
dependencies = [
  "modal>=1.5,<2",
  "pillow>=10,<13",
  "playwright>=1.50,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
train = [
  "accelerate>=1.13,<2",
  "numpy>=2,<3",
  "peft>=0.19,<1",
  "safetensors>=0.5,<1",
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
  "transformers>=4.57,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

